name: Build iWebPlayer-S Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'static/**'
      - 'plugin.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: iwebplayer-s-plugin
          path: dist/iwebplayer-s.jsplugin.zip
          if-no-files-found: error

      # 发布插件 zip 到 GitHub Release（main：与 APK 同一个 release 线 v*；dev：独立 dev-* release 线）
      - name: Publish plugin to release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          cp dist/iwebplayer-s.jsplugin.zip "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"
          # 插件 zip 上传到最新 release（APK 发布线）；版本化文件名保留旧插件
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /')
          else
            NOTES=$(git log --oneline --no-merges -20 | sed 's/^/- /')
          fi
          PLUGIN_NOTES="## 插件更新（iWebPlayer-S v${PLUGIN_VERSION}）

          ${NOTES}"
          if [ -n "$LATEST" ]; then
            gh release upload "$LATEST" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" --clobber
            # 把插件更新内容追加进 release 正文（已包含则跳过，避免重复）
            if ! gh release view "$LATEST" --json body --jq '.body' | grep -q "iWebPlayer-S v${PLUGIN_VERSION}"; then
              BODY=$(gh release view "$LATEST" --json body --jq '.body')
              gh release edit "$LATEST" --notes "$(printf '%s\n\n%s' "$BODY" "$PLUGIN_NOTES")"
            fi
          else
            gh release create "plugin-v${PLUGIN_VERSION}" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" \
              --title "iWebPlayer-S v${PLUGIN_VERSION}" \
              --notes "$PLUGIN_NOTES"
          fi

      # dev 分支：发布到独立的 dev-* release 线（不抢 main 的 latest，产物带 -dev）
      - name: Publish plugin to release (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          DEV_TAG="dev-${PLUGIN_VERSION}"
          cp dist/iwebplayer-s.jsplugin.zip "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"
          NOTES=$(git log --oneline --no-merges -10 | sed 's/^/- /')
          PLUGIN_NOTES="## iWebPlayer-S dev 构建 v${PLUGIN_VERSION}

          ${NOTES}"
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            # 已存在 → 覆盖上传新版，更新正文
            gh release upload "$DEV_TAG" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" --clobber
            gh release edit "$DEV_TAG" --notes "$PLUGIN_NOTES"
          else
            gh release create "$DEV_TAG" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" \
              --title "iWebPlayer-S dev v${PLUGIN_VERSION}" \
              --notes "$PLUGIN_NOTES"
          fi
