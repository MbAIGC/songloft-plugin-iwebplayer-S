name: Build iWebPlayer-S Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'plugin.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: iwebplayer-s-plugin
          path: dist/iwebplayer-s.jsplugin.zip
          if-no-files-found: error

      # 发布插件 zip 到 GitHub Release（与 APK 同一个 release 线）
      - name: Publish plugin to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          cp dist/iwebplayer-s.jsplugin.zip "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            gh release upload "$LATEST" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" --clobber
          else
            PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty' 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /')
            else
              NOTES=$(git log --oneline --no-merges -20 | sed 's/^/- /')
            fi
            gh release create "v${PLUGIN_VERSION}" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" \
              --title "iWebPlayer-S v${PLUGIN_VERSION}" \
              --notes "## 更新内容

$NOTES"
          fi
