# ============================================================================
# Test Build Dev Plugin (iWebPlayer-S)  —— 调试用，不与正式流程冲突
# ----------------------------------------------------------------------------
# 目的：验证「每次 dev 构建自动递增版本 → 发布 pre-release → 生成并提交
#       manifest.json」的完整链路。与正式 build-plugin-dev.yml 并存：
#       * 仅 workflow_dispatch 手动触发，不监听 push，不改动正式流程；
#       * 每次 dev 构建版本都保留（不删历史 zip），序号从当前 dev pre-release
#         已有 zip 文件名解析最大值 +1；
#       * 同一基础版本共用一个 pre-release tag（如 dev-1.1.6），
#         每个构建版本一个独立 zip（iwebplayer-s-v1.1.6.04-dev.jsplugin.zip）；
#       * ZIP 内 plugin.json 使用实际构建版本（构建前临时改、构建后恢复）；
#       * 发布成功后生成根级 manifest.json（version + 动态 download_url）并
#         提交推送到 dev —— manifest.json 不在触发路径，提交后不重触发防循环。
# ============================================================================

name: Test Build Dev Plugin (iWebPlayer-S)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 与正式 build-plugin-dev.yml / build-apk-dev.yml 共享同一组：
  # 三者同写 dev Release，须串行避免互相覆盖
  group: dev-release
  cancel-in-progress: false

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read base version
        id: version
        run: |
          BASE=$(jq -r '.version' plugin.json)
          echo "base_version=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE"

      - name: Determine release tag
        id: release
        env:
          BASE: ${{ steps.version.outputs.base_version }}
        run: |
          TAG="dev-${BASE%-dev}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Resolve latest build sequence from release assets
        id: seq
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release.outputs.release_tag }}';
            let releaseId = null;
            let maxSeq = 0;
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag });
              releaseId = rel.data.id;
              const { data: assets } = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: rel.data.id, per_page: 100 });
              // 只统计同基础版本、且带构建序号的 zip（如 v1.1.6.04-dev），
              // 忽略正式 workflow 产出的基础版本 zip（v1.1.6-dev，无序号段）
              const base = '${{ steps.version.outputs.base_version }}'.replace(/-dev$/, '');
              const prefix = `iwebplayer-s-v${base}.`;
              for (const a of assets) {
                if (!a.name.startsWith(prefix)) continue;
                const m = a.name.match(/(\d+)-dev\.jsplugin\.zip$/);
                if (m) maxSeq = Math.max(maxSeq, parseInt(m[1], 10));
              }
            } catch (e) {
              // release 不存在 → releaseId=null, maxSeq=0，稍后创建
            }
            core.setOutput('release_id', releaseId ?? '');
            core.setOutput('max_seq', maxSeq);

      - name: Compute build version
        id: version_build
        env:
          BASE: ${{ steps.version.outputs.base_version }}
          MAX_SEQ: ${{ steps.seq.outputs.max_seq }}
        run: |
          SEQ=$((MAX_SEQ + 1))
          BUILD="${BASE%-dev}.$(printf '%02d' "$SEQ")-dev"
          echo "build_version=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build version: $BUILD"

      - name: Temporarily set build version in plugin.json
        env:
          BUILD: ${{ steps.version_build.outputs.build_version }}
        run: |
          jq --arg v "$BUILD" '.version = $v' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          echo "plugin.json version now: $(jq -r '.version' plugin.json)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify ZIP version equals build version
        env:
          BUILD: ${{ steps.version_build.outputs.build_version }}
        run: |
          INNER=$(unzip -p dist/iwebplayer-s.jsplugin.zip plugin.json | jq -r '.version')
          echo "zip inner version: $INNER"
          if [ "$INNER" != "$BUILD" ]; then
            echo "❌ zip 内 version($INNER) ≠ 期望($BUILD)"
            exit 1
          fi
          echo "✅ zip 内 version 与构建版本一致"

      - name: Rename ZIP to versioned name
        env:
          BUILD: ${{ steps.version_build.outputs.build_version }}
        run: |
          mv dist/iwebplayer-s.jsplugin.zip "dist/iwebplayer-s-v${BUILD}.jsplugin.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iwebplayer-s-v${{ steps.version_build.outputs.build_version }}.jsplugin.zip
          path: dist/iwebplayer-s-v${{ steps.version_build.outputs.build_version }}.jsplugin.zip

      - name: Publish to pre-release + generate manifest.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.release.outputs.release_tag }}';
            const buildVer = '${{ steps.version_build.outputs.build_version }}';
            const newName = `iwebplayer-s-v${buildVer}.jsplugin.zip`;
            let releaseId = ${{ steps.seq.outputs.release_id || 'null' }};
            if (!releaseId) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag, name: tag,
                body: 'Development Pre-release for iWebPlayer-S',
                draft: false, prerelease: true
              });
              releaseId = created.data.id;
            }
            const assetPath = `dist/${newName}`;
            if (!fs.existsSync(assetPath)) {
              console.error(`❌ asset not found: ${assetPath}`);
              process.exit(1);
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: releaseId, name: newName,
              data: fs.readFileSync(assetPath)
            });
            console.log('✅ uploaded:', newName);
            const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${newName}`;
            fs.writeFileSync('manifest.json', JSON.stringify({ version: buildVer, download_url: downloadUrl }, null, 2) + '\n');
            console.log('manifest.json →', fs.readFileSync('manifest.json', 'utf8').trim());

      - name: Restore original plugin.json
        env:
          BASE: ${{ steps.version.outputs.base_version }}
        run: |
          jq --arg v "$BASE" '.version = $v' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          echo "plugin.json version restored: $(jq -r '.version' plugin.json)"

      - name: Commit and push manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json 无变化，跳过提交"
          else
            git commit -m "ci(test): update manifest.json to ${{ steps.version_build.outputs.build_version }}"
            git pull --rebase || true
            git push origin dev
          fi
