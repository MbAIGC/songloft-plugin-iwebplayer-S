name: Build iWebPlayer-S Plugin (dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'static/**'
      - 'plugin.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-plugin-dev.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: iwebplayer-s-plugin-dev
          path: dist/iwebplayer-s.jsplugin.zip
          if-no-files-found: error

      # dev 专用：发布带 -dev 产物到 dev-* prerelease（不抢 main 的 Latest）
      - name: Publish plugin to release (dev)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          # dev tag 使用干净的 dev-<数字版本>（如 dev-1.1.5），产物文件名仍带 -dev
          DEV_WITH_SUFFIX="${PLUGIN_VERSION}"
          DEV_VERSION="${DEV_WITH_SUFFIX%-dev}"
          DEV_TAG="dev-${DEV_VERSION}"
          cp dist/iwebplayer-s.jsplugin.zip "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"
          NOTES=$(git log --oneline --no-merges -10 | sed 's/^/- /')
          RELEASE_NOTES="$(cat DEV_RELEASE_NOTES.md)

          ## 本次构建提交

          ${NOTES}"
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            # 已存在 → 覆盖上传新版，更新正文（保持 prerelease，不抢 main 的 Latest）
            gh release upload "$DEV_TAG" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" --clobber
            gh release edit "$DEV_TAG" --prerelease --notes "$RELEASE_NOTES"
          else
            gh release create "$DEV_TAG" "dist/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip" \
              --prerelease \
              --title "iWebPlayer-S dev v${PLUGIN_VERSION}" \
              --notes "$RELEASE_NOTES"
          fi