name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 0.0.1），留空则自动从上次 release 递增'
        required: false
        default: ''
  push:
    branches: [main, dev]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ------------------------------------------------------------
      # 版本号解析：
      #   1) 推 tag（如 v0.0.1）→ 用 tag 版本
      #   2) 手动触发时填了 version → 用填的版本
      #   3) 其它情况 → 查询上次 release，patch +1；没有则从 v0.0.1 开始
      # ------------------------------------------------------------
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dev 分支：直接使用 plugin.json 的版本（如 1.1.5-dev），versionCode 取数字段
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            VERSION_FULL=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
            VERSION="$VERSION_FULL"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$LATEST" ] && [[ "$LATEST" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              VERSION="0.0.1"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode 只取纯数字段（剥离 -dev 等后缀）
          VERCODE=$(echo "$VERSION" | sed 's/-.*$//')
          IFS='.' read -r VM VN VP <<< "$VERCODE"
          echo "versionCode=$((10#$VM * 10000 + 10#$VN * 100 + 10#$VP))" >> "$GITHUB_OUTPUT"
          echo "APK will be named: iWebPlayer-S-v${VERSION}.apk"

      # ------------------------------------------------------------
      # 用固定签名（Secrets 中的 keystore）签名 release 包，
      # 避免每次构建生成不同 debug 证书导致覆盖安装冲突
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/iwebplayer-release.p12
          {
            echo "storeFile=iwebplayer-release.p12"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=iwebplayer"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "storeType=PKCS12"
          } > android/keystore.properties

      # ------------------------------------------------------------
      # 同步构建插件 zip（与 APK 发布到同一个 Release，SongLoft 可直接上传安装）
      # ------------------------------------------------------------
      - name: Build plugin zip
        run: |
          npm ci
          npm run build
          mkdir -p release
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          cp dist/iwebplayer-s.jsplugin.zip "release/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWebPlayer-S-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/* --clobber
          else
            gh release create "v${VERSION}" release/* \
              --title "v${VERSION}" \
              --notes "iWebPlayer-S Android APK v${VERSION}"
          fi

      # dev 分支：发布到独立的 dev-* release 线（不抢 main 的 latest，产物带 -dev）
      - name: Publish GitHub Release (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # dev tag 使用干净的 dev-<数字版本>（如 dev-1.1.5），产物文件名仍带 -dev
          DEV_VERSION="${VERSION%-dev}"
          DEV_TAG="dev-${DEV_VERSION}"
          NOTES=$(git log --oneline --no-merges -10 | sed 's/^/- /')
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            gh release upload "$DEV_TAG" release/* --clobber
            gh release edit "$DEV_TAG" --prerelease --notes "iWebPlayer-S dev 构建 v${VERSION}

          ${NOTES}"
          else
            gh release create "$DEV_TAG" release/* \
              --prerelease \
              --title "iWebPlayer-S dev v${VERSION}" \
              --notes "iWebPlayer-S dev 构建 v${VERSION}

          ${NOTES}"
          fi
