name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 0.0.1），留空则自动从上次 release 递增'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 版本号解析：
      #   1) 推 tag（如 v0.0.1）→ 用 tag 版本
      #   2) 手动触发时填了 version → 用填的版本
      #   3) 其它情况 → 查询上次 release，patch +1；没有则从 v0.0.1 开始
      # ------------------------------------------------------------
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$LATEST" ] && [[ "$LATEST" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              VERSION="0.0.1"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r VM VN VP <<< "$VERSION"
          echo "versionCode=$((10#$VM * 10000 + 10#$VN * 100 + 10#$VP))" >> "$GITHUB_OUTPUT"
          echo "APK will be named: iWebPlayer-S-v${VERSION}.apk"

      # ------------------------------------------------------------
      # 用固定签名（Secrets 中的 keystore）签名 release 包，
      # 避免每次构建生成不同 debug 证书导致覆盖安装冲突
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/iwebplayer-release.p12
          {
            echo "storeFile=iwebplayer-release.p12"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=iwebplayer"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "storeType=PKCS12"
          } > android/keystore.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon \
          -PversionCode=${{ steps.version.outputs.versionCode }} \
          -PversionName=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWebPlayer-S-APK-v${{ steps.version.outputs.version }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/*.apk --clobber
          else
            gh release create "v${VERSION}" release/*.apk \
              --title "v${VERSION}" \
              --notes "iWebPlayer-S Android APK v${VERSION}"
          fi
