name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 0.0.1），留空则自动从上次 release 递增'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'plugin.json'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔐 需要完整历史 + 全部标签做版本计算

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ------------------------------------------------------------
      # 版本号解析：
      #   1) 推 tag（如 v0.0.1）→ 用 tag 版本
      #   2) 手动触发时填了 version → 用填的版本（格式校验）
      #   3) 其它情况 → 从 git 稳定标签（vX.Y.Z，非 prerelease）取最新并 patch+1；
      #      忽略 dev / 1.1.6-dev 等预发布标签，避免误回退到 0.0.1
      # ------------------------------------------------------------
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            LATEST_TAG=$(git tag -l | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { split($0, a, /[v.]/); printf "%d %d %d %s\n", a[2], a[3], a[4], $0 }' | \
              sort -k1,1n -k2,2n -k3,3n | tail -1 | awk '{ print $4 }')
            if [ -n "$LATEST_TAG" ]; then
              BASE="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              VERSION="0.0.1"
            fi
          fi
          # 🔐 版本格式校验：必须是 x.y.z 纯数字
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ 非法版本号: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r VM VN VP <<< "$VERSION"
          echo "versionCode=$((10#$VM * 10000 + 10#$VN * 100 + 10#$VP))" >> "$GITHUB_OUTPUT"
          echo "APK will be named: iWebPlayer-S-v${VERSION}.apk"

      # ------------------------------------------------------------
      # 用固定签名（Secrets 中的 keystore）签名 release 包，
      # 避免每次构建生成不同 debug 证书导致覆盖安装冲突
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/iwebplayer-release.p12
          {
            echo "storeFile=iwebplayer-release.p12"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=iwebplayer"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "storeType=PKCS12"
          } > android/keystore.properties

      # ------------------------------------------------------------
      # 同步构建插件 zip（与 APK 发布到同一个 Release，SongLoft 可直接上传安装）
      # ------------------------------------------------------------
      - name: Build plugin zip
        run: |
          npm ci
          npm run build
          mkdir -p release
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          cp dist/iwebplayer-s.jsplugin.zip "release/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWebPlayer-S-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 🔐 变更说明按标签范围生成：上一稳定版 → HEAD；无则取最近 50 条
          PREV_TAG=$(git tag -l | awk -v cur="v${VERSION}" '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != cur { split($0, a, /[v.]/); printf "%d %d %d %s\n", a[2], a[3], a[4], $0 }' | \
            sort -k1,1n -k2,2n -k3,3n | tail -1 | awk '{ print $4 }')
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          else
            NOTES=$(git log --oneline --no-merges | head -50)
          fi
          NOTES="iWebPlayer-S Android APK v${VERSION}

$NOTES"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/* --clobber
            gh release edit "v${VERSION}" --notes "$NOTES"
          else
            gh release create "v${VERSION}" release/* \
              --title "v${VERSION}" \
              --notes "$NOTES"
          fi
