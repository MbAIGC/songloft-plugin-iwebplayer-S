name: Build Android APK (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 0.0.1），留空则从 plugin.json 读取'
        required: false
        default: ''
  push:
    branches: [dev]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk-dev.yml'
      - 'plugin.json'

permissions:
  contents: write

concurrency:
  # 🔐 与 build-plugin-dev.yml 共享同一组：两者同写 dev Release，须串行避免互相覆盖
  group: dev-release
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ------------------------------------------------------------
      # dev 版本号解析：默认直接使用 plugin.json 的版本（如 1.1.5-dev），
      # versionCode 取数字段；手动触发填了 version 时优先用它。
      # ------------------------------------------------------------
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode 只取纯数字段（剥离 -dev 等后缀）
          VERCODE=$(echo "$VERSION" | sed 's/-.*$//')
          IFS='.' read -r VM VN VP <<< "$VERCODE"
          echo "versionCode=$((10#$VM * 10000 + 10#$VN * 100 + 10#$VP))" >> "$GITHUB_OUTPUT"
          echo "APK will be named: iWebPlayer-S-v${VERSION}.apk"

      # ------------------------------------------------------------
      # 用固定签名（Secrets 中的 keystore）签名 release 包
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/iwebplayer-release.p12
          {
            echo "storeFile=iwebplayer-release.p12"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=iwebplayer"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "storeType=PKCS12"
          } > android/keystore.properties

      # ------------------------------------------------------------
      # 同步构建插件 zip（与 APK 发布到同一个 dev release，SongLoft 可直接上传安装）
      # ------------------------------------------------------------
      - name: Build plugin zip (with quality gates)
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          node scripts/verify-build.mjs
          mkdir -p release
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          cp dist/iwebplayer-s.jsplugin.zip "release/iwebplayer-s-v${PLUGIN_VERSION}.jsplugin.zip"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "release/iWebPlayer-S-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWebPlayer-S-dev-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      # dev 专用：发布到 dev-* prerelease（不抢 main 的 Latest，产物带 -dev）
      - name: Publish GitHub Release (dev)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # dev tag 使用干净的 dev-<数字版本>（如 dev-1.1.5），产物文件名仍带 -dev
          DEV_VERSION="${VERSION%-dev}"
          DEV_TAG="dev-${DEV_VERSION}"
          # 🌟 正文固定来源：DEV_RELEASE_NOTES.md（与 build-plugin-dev.yml 一致），
          # 保留人工维护的说明，末尾再追加本次构建的提交列表
          RELEASE_NOTES="$(cat DEV_RELEASE_NOTES.md)

          ## 本次构建提交

          $(git log --oneline --no-merges -10 | sed 's/^/- /')"
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            gh release upload "$DEV_TAG" release/* --clobber
            gh release edit "$DEV_TAG" --prerelease --notes "$RELEASE_NOTES"
          else
            gh release create "$DEV_TAG" release/* \
              --prerelease \
              --title "iWebPlayer-S dev v${VERSION}" \
              --notes "$RELEASE_NOTES"
          fi