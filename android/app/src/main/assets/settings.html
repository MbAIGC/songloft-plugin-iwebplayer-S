<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置</title>
<style>
  body{background:#0b0b0f;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
  .card{background:rgba(255,255,255,.06);backdrop-filter:blur(32px);border-radius:32px;padding:32px;max-width:400px;width:100%;box-sizing:border-box}
  h1{font-size:22px;margin-bottom:6px}
  .sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:24px}
  input{width:100%;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#fff;font-size:15px;margin-bottom:14px;box-sizing:border-box;outline:none}
  input:focus{border-color:#5b47ff}
  .row{display:flex;gap:8px}
  .row select{width:78px;flex-shrink:0;padding:14px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#fff;font-size:15px;outline:none;appearance:none;-webkit-appearance:none}
  .row select option{background:#14141c;color:#fff}
  .row input:first-of-type{flex:1;min-width:0}
  .row input.port{width:86px;flex-shrink:0}
  .agree{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:18px;line-height:1.5;cursor:pointer;user-select:none}
  .agree input{width:16px;height:16px;margin:1px 0 0 0;flex-shrink:0;accent-color:#5b47ff}
  .agree b{color:rgba(255,255,255,.85);font-weight:600}
  button{width:100%;padding:16px;background:linear-gradient(135deg,#5b47ff,#7c5cfc);border:none;border-radius:16px;color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:disabled{opacity:.5;cursor:default}
  .status{margin-top:16px;text-align:center;color:rgba(255,255,255,.45);font-size:13px;min-height:18px;word-break:break-all}
  .footer{margin-top:20px;text-align:center;color:rgba(255,255,255,.15);font-size:11px}
</style>
</head>
<body>
<div class="card">
  <h1>🎵 连接服务器</h1>
  <div class="sub">登录后直接进入 iWebPlayer-S 播放器</div>
  <form id="f">
    <div class="row">
      <select id="proto">
        <option value="http" selected>http</option>
        <option value="https">https</option>
      </select>
      <input id="s" placeholder="服务器地址" value="192.168.100.100" required autocomplete="off">
      <input id="pt" class="port" placeholder="端口" value="58091" inputmode="numeric" required autocomplete="off">
    </div>
    <input id="u" placeholder="用户名" required autocomplete="username">
    <input id="p" type="password" placeholder="密码" required autocomplete="current-password">
    <label class="agree">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意 <b>《用户协议》</b> 与 <b>《隐私政策》</b>，并确认服务器为本人搭建或已获授权使用。</span>
    </label>
    <button id="btn" type="submit">登录并进入</button>
  </form>
  <div class="status" id="msg">请输入服务器信息并登录</div>
  <div class="footer">账号信息仅存储于本机</div>
</div>

<script>
(function(){
  try {
    var sv = Android.getServer();
    var un = Android.getUsername();
    if (sv) {
      var m = sv.match(/^(https?):\/\/([^:/]+)(?::(\d+))?/i);
      if (m) {
        document.getElementById("proto").value = m[1];
        document.getElementById("s").value = m[2];
        document.getElementById("pt").value = m[3] || "";
      } else {
        document.getElementById("s").value = sv;
      }
    }
    if (un) document.getElementById("u").value = un;
  } catch(e) {}
})();

function composeServer(){
  var proto = document.getElementById("proto").value || "http";
  var host = document.getElementById("s").value.trim().replace(/^https?:\/\//i, "");
  var port = document.getElementById("pt").value.trim();
  return proto + "://" + host + (port ? ":" + port : "");
}

window.__loginCb = function(id, res) {
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  btn.disabled = false;
  btn.textContent = "登录并进入";
  if (res && res.ok) {
    msg.textContent = "✅ 登录成功，正在进入播放器...";
    setTimeout(function(){ Android.openPlayer(); }, 500);
  } else {
    msg.textContent = "❌ " + (res && res.error ? res.error : "未知错误");
  }
};

document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var s = composeServer();
  var u = document.getElementById("u").value.trim();
  var p = document.getElementById("p").value;
  var msg = document.getElementById("msg");
  if (!s || !u || !p) { msg.textContent = "❌ 请填写完整的服务器、账号与密码"; return; }
  if (!document.getElementById("agree").checked) { msg.textContent = "❌ 请先勾选同意用户协议"; return; }
  var btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "登录中...";
  msg.textContent = "⏳ 正在连接服务器并登录...";
  try {
    Android.login(s, u, p, 1);
  } catch(err) {
    btn.disabled = false;
    btn.textContent = "登录并进入";
    msg.textContent = "❌ " + err.message;
  }
});
</script>
</body>
</html>
